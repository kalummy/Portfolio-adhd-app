<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>아디 실행 안내</title>
  <style>
    body { margin: 0; background: #fafafb; color: #27272a; font-family: sans-serif; }
    main { max-width: 420px; margin: 56px auto; padding: 24px; }
    h1 { font-size: 24px; line-height: 1.4; }
    p, li { font-size: 16px; line-height: 1.7; }
    ol { padding-left: 24px; }
    .note { color: #52525b; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>앱 실행에 필요한 업데이트</h1>
    <p>이 기기의 Android System WebView가 오래되어 앱 화면을 열 수 없어요.</p>
    <ol>
      <li>Google Play에서 <strong>Android System WebView</strong>를 검색해주세요.</li>
      <li>업데이트한 뒤 아디 앱을 다시 열어주세요.</li>
    </ol>
    <p class="note">업데이트가 표시되지 않으면 기기의 시스템 업데이트를 확인해주세요.</p>
  </main>
</body>
</html>
